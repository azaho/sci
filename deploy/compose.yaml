name: sci-local

x-publisher: &publisher
  build:
    context: ..
    dockerfile: server/Dockerfile
  image: sci-local-publisher
  environment: &runtime
    PUBLISHER_DATABASE_URL: postgresql://sci_publisher:${LOCAL_PUBLISHER_PASSWORD:-local-publisher-only}@database:5432/sci
    S3_ENDPOINT_URL: http://storage:9000
    S3_PUBLIC_ENDPOINT_URL: http://localhost:${SCI_STORAGE_PORT:-9000}
    S3_REGION: us-east-1
    R2_ACCESS_KEY_ID: ${LOCAL_STORAGE_USER:-sci-local}
    R2_SECRET_ACCESS_KEY: ${LOCAL_STORAGE_PASSWORD:-local-storage-only-change-me}
    TEMPORARY_BUCKET: sci-temporary
    ARCHIVE_BUCKET: sci-public
    INSTANCE_URL: http://localhost:${SCI_WEB_PORT:-8080}
    ARCHIVE_URL: http://localhost:${SCI_WEB_PORT:-8080}/archive/publications
    SCI_BIND_UPLOAD_SIZE: "false"

services:
  database:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: sci
      POSTGRES_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-local-admin-only}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sci"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage-config:
    <<: *publisher
    user: "0:0"
    command: ["python", "-m", "deploy.storage_config"]
    volumes:
      - storage-config:/storage-config

  storage:
    image: chrislusf/seaweedfs:4.48
    command:
      - mini
      - -dir=/data
      - -ip=storage
      - -ip.bind=0.0.0.0
      - -s3.port=9000
      - -s3.config=/storage-config/iam.json
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -admin.ui=false
      - -webdav=false
      - -master.telemetry=false
    volumes:
      - archive:/data
      - storage-config:/storage-config:ro
    ports:
      - "127.0.0.1:${SCI_STORAGE_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    depends_on:
      storage-config:
        condition: service_completed_successfully

  initialize:
    <<: *publisher
    user: "0:0"
    command: ["python", "-m", "deploy.local_init"]
    environment:
      <<: *runtime
      ADMIN_DATABASE_URL: postgresql://postgres:${LOCAL_ADMIN_PASSWORD:-local-admin-only}@database:5432/sci
      LOCAL_PUBLISHER_PASSWORD: ${LOCAL_PUBLISHER_PASSWORD:-local-publisher-only}
      LOCAL_CATALOG_PASSWORD: ${LOCAL_CATALOG_PASSWORD:-local-catalog-only}
      PUBLISHING_API_URL: http://localhost:${SCI_PUBLISHER_PORT:-8000}
      CATALOG_URL: http://localhost:${SCI_WEB_PORT:-8080}/catalog
    volumes:
      - website:/site
    depends_on:
      database:
        condition: service_healthy
      storage:
        condition: service_healthy

  publisher:
    <<: *publisher
    ports:
      - "127.0.0.1:${SCI_PUBLISHER_PORT:-8000}:8000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 10
    restart: unless-stopped

  catalog:
    image: postgrest/postgrest:v16.5
    environment:
      PGRST_DB_URI: postgresql://sci_authenticator:${LOCAL_CATALOG_PASSWORD:-local-catalog-only}@database:5432/sci
      PGRST_DB_SCHEMAS: catalog_v1
      PGRST_DB_ANON_ROLE: sci_anon
      PGRST_DB_MAX_ROWS: "100"
      PGRST_DB_AGGREGATES_ENABLED: "false"
      PGRST_SERVER_CORS_ALLOWED_ORIGINS: "*"
      PGRST_SERVER_PORT: "3000"
      PGRST_DB_POOL: "10"
      PGRST_DB_POOL_ACQUISITION_TIMEOUT: "10"
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: nginx:1.30.0-alpine
    volumes:
      - website:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${SCI_WEB_PORT:-8080}:8080"
    depends_on:
      initialize:
        condition: service_completed_successfully
      catalog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/sci-server.json"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  database:
  archive:
  website:
  storage-config:
