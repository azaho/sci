limit_req_zone $binary_remote_addr zone=catalog:10m rate=10r/s;
map $uri $archive_content_type {
    default application/octet-stream;
    ~/(sci|manifest|acceptance)\.json$ application/json;
    ~/(README\.md|LICENSE)$ "text/plain; charset=utf-8";
    ~/headline_figure\.png$ image/png;
    ~/files\.zip$ application/zip;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Access-Control-Allow-Origin "*" always;
    location / {
        try_files $uri $uri/ =404;
    }
    location /catalog/ {
        limit_req zone=catalog burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://catalog:3000/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Content-Type-Options;
        proxy_read_timeout 10s;
    }
    location /archive/ {
        limit_except GET { deny all; }
        proxy_pass http://storage:9000/sci-public/;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Type;
        add_header Content-Type $archive_content_type always;
        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Referrer-Policy no-referrer always;
    }
}
