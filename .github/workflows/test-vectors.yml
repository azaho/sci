name: Test vectors

on:
  pull_request:
    paths:
      - 'protocol/test-vectors/**'
      - 'protocol/README.md'
      - 'protocol/sci-baseline-LICENSE.txt'
      - '.github/workflows/test-vectors.yml'
  push:
    branches: [main]
    paths:
      - 'protocol/test-vectors/**'
      - 'protocol/README.md'
      - 'protocol/sci-baseline-LICENSE.txt'
      - '.github/workflows/test-vectors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: protocol/test-vectors/requirements.txt
      - run: python -m pip install -r protocol/test-vectors/requirements.txt
      - name: Audit fixture outcomes and independent OpenSSL checks
        run: python protocol/test-vectors/tools/audit.py --openssl
      - name: Cross-check publications and records with the independent checker
        run: python protocol/test-vectors/tools/independent.py
      - name: Check the adapter contract and entire Unicode codespace
        run: python protocol/test-vectors/tools/test_tools.py
      - name: Exercise the downstream implementation adapter
        run: >-
          python protocol/test-vectors/tools/run_adapter.py
          --kind publication --kind claim --kind revocation --
          python protocol/test-vectors/tools/reference_adapter.py
      - name: Verify byte-for-byte regeneration
        run: python protocol/test-vectors/tools/check_reproducible.py
      - run: git diff --exit-code
