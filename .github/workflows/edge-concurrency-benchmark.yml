name: edge-concurrency-benchmark

on:
  push:
    branches: [bench/supabase-verification]
    paths: ['benchmarks/edge/concurrency/*.py', '.github/workflows/edge-concurrency-benchmark.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: sci-edge-concurrency-benchmark
  cancel-in-progress: false

jobs:
  comparison:
    if: github.repository == 'azaho/sci' && github.ref == 'refs/heads/bench/supabase-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - run: python -m pip install cryptography==46.0.3 requests==2.32.5 asn1crypto==1.5.1
      - name: Generate and verify the same twenty bundles for both handlers
        run: |
          python benchmarks/edge/soak/generate.py "$RUNNER_TEMP/fixtures"
          deno check benchmarks/edge/full/index.ts benchmarks/edge/full/check.ts
          deno run --allow-read benchmarks/edge/full/check.ts "$RUNNER_TEMP/fixtures"
      - name: Guarded control (200 attempts)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SCI_EDGE_BENCH_SUPABASE_TOKEN }}
          SUPABASE_KEY_READ_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python benchmarks/edge/concurrency/run.py "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/results/wave-0" --mode guarded
      - name: Preserve guarded outcomes and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-concurrency-guarded
          path: ${{ runner.temp }}/results/wave-0/
      - name: Unguarded comparison (200 attempts)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SCI_EDGE_BENCH_SUPABASE_TOKEN }}
          SUPABASE_KEY_READ_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python benchmarks/edge/concurrency/run.py "$RUNNER_TEMP/fixtures" "$RUNNER_TEMP/results/wave-1" --mode unguarded
      - name: Preserve unguarded outcomes and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-concurrency-unguarded
          path: ${{ runner.temp }}/results/wave-1/
      - name: Allow shutdown telemetry to settle
        run: sleep 180
      - name: Collect function-scoped runtime logs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SCI_EDGE_BENCH_SUPABASE_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python benchmarks/edge/soak/collect_logs.py "$RUNNER_TEMP/results" "$RUNNER_TEMP/telemetry" --expected-deployments 2
      - name: Preserve telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-concurrency-telemetry
          path: ${{ runner.temp }}/telemetry/
      - name: Evaluate recorded outcomes
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,collections
          rs=[]
          for p in (Path(os.environ['RUNNER_TEMP'])/'results').glob('wave-*/results.json'):
              r=json.loads(p.read_text());rs.extend(r)
              print(p.parent.name,dict(collections.Counter(x['outcome'] for x in r)))
          assert len(rs)==400, 'Incomplete comparison'
          assert all(r['passed'] for r in rs), 'Some first attempts failed; inspect preserved evidence'
          PY
