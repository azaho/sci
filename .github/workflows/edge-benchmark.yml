name: edge-verification-benchmark

# This branch-only experiment never runs on PRs or deploys the publishing service.
on:
  push:
    branches: [bench/supabase-verification]
    paths: ['benchmarks/edge/**', '.github/workflows/edge-benchmark.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sci-edge-verification-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    if: github.repository == 'azaho/sci' && github.ref == 'refs/heads/bench/supabase-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Install benchmark dependencies
        run: python -m pip install cryptography==46.0.3 requests==2.32.5
      - name: Generate synthetic publications
        run: python benchmarks/edge/generate.py "$RUNNER_TEMP/edge-fixtures"
      - name: Check verifier behavior locally (not a hosted performance result)
        run: |
          deno check benchmarks/edge/index.ts benchmarks/edge/check.ts
          deno run --allow-read benchmarks/edge/check.ts "$RUNNER_TEMP/edge-fixtures"
      - name: Deploy, benchmark, and remove temporary resources
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python benchmarks/edge/run.py "$RUNNER_TEMP/edge-fixtures" "$RUNNER_TEMP/edge-results"
      - name: Preserve measurements and cleanup status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-verification-results
          path: ${{ runner.temp }}/edge-results/
          if-no-files-found: warn
