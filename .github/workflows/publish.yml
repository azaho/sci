name: Publish sci-protocol

on:
  release:
    types: [published]
  # A manual run rehearses the build and installs, without publishing.
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: publish-sci-protocol-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'pysci-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - name: Check release tag and source
        if: github.event_name == 'release'
        env:
          PYSCI_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="pysci-v$(uv run python -c 'import pysci; print(pysci.__version__)')"
          if [[ "$PYSCI_RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag must match the package version: $expected" >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
      - name: Check Python library and CLI
        run: |
          uv run ruff check python
          uv run ruff format --check python
          uv run mypy
          uv run pytest
      - name: Build distributions
        run: uv build
      - name: Test wheel and source installations
        run: |
          for artifact in "$PWD"/dist/*.whl "$PWD"/dist/*.tar.gz; do
            python/tests/cli/install_check.sh "$artifact"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sci-protocol-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'pysci-v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sci-protocol/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sci-protocol-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
