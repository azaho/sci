name: edge-soak-benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: sci-edge-soak-benchmark
  cancel-in-progress: false

jobs:
  soak:
    if: github.repository == 'azaho/sci' && github.ref == 'refs/heads/bench/supabase-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Install fixture and harness dependencies
        run: python -m pip install cryptography==46.0.3 requests==2.32.5 asn1crypto==1.5.1
      - name: Generate twenty distinct 50 MB publications
        run: python benchmarks/edge/soak/generate.py "$RUNNER_TEMP/soak-fixtures"
      - name: Verify every fixture locally before hosted measurements
        run: |
          deno check benchmarks/edge/full/index.ts benchmarks/edge/full/check.ts
          deno run --allow-read benchmarks/edge/full/check.ts "$RUNNER_TEMP/soak-fixtures"
      - name: Wave 1 of 4 (250 requests)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SCI_EDGE_BENCH_SUPABASE_TOKEN }}
          SUPABASE_KEY_READ_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python benchmarks/edge/soak/run.py "$RUNNER_TEMP/soak-fixtures" "$RUNNER_TEMP/soak-results/wave-0" --wave 0
      - name: Preserve wave 1 measurements and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-soak-wave-0
          path: ${{ runner.temp }}/soak-results/wave-0/
          if-no-files-found: warn
      - name: Wave 2 of 4 (250 requests)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SCI_EDGE_BENCH_SUPABASE_TOKEN }}
          SUPABASE_KEY_READ_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python benchmarks/edge/soak/run.py "$RUNNER_TEMP/soak-fixtures" "$RUNNER_TEMP/soak-results/wave-1" --wave 1
      - name: Preserve wave 2 measurements and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-soak-wave-1
          path: ${{ runner.temp }}/soak-results/wave-1/
          if-no-files-found: warn
      - name: Wave 3 of 4 (250 requests)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SCI_EDGE_BENCH_SUPABASE_TOKEN }}
          SUPABASE_KEY_READ_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python benchmarks/edge/soak/run.py "$RUNNER_TEMP/soak-fixtures" "$RUNNER_TEMP/soak-results/wave-2" --wave 2
      - name: Preserve wave 3 measurements and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-soak-wave-2
          path: ${{ runner.temp }}/soak-results/wave-2/
          if-no-files-found: warn
      - name: Wave 4 of 4 (250 requests)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SCI_EDGE_BENCH_SUPABASE_TOKEN }}
          SUPABASE_KEY_READ_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python benchmarks/edge/soak/run.py "$RUNNER_TEMP/soak-fixtures" "$RUNNER_TEMP/soak-results/wave-3" --wave 3
      - name: Preserve wave 4 measurements and cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-soak-wave-3
          path: ${{ runner.temp }}/soak-results/wave-3/
          if-no-files-found: warn
      - name: Evaluate completed soak
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import json,os,collections
          records=[]
          for p in (Path(os.environ['RUNNER_TEMP'])/'soak-results').glob('wave-*/results.json'):
              records.extend(json.loads(p.read_text()))
          print(json.dumps({'requests':len(records),'outcomes':dict(collections.Counter(r['outcome'] for r in records))},indent=2))
          assert len(records)==1000, 'Incomplete soak; inspect per-wave artifacts'
          assert all(r['passed'] for r in records), 'Request failures occurred; preserve and analyze them'
          PYTHON
