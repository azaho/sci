name: edge-benchmark-logs

on:
  push:
    branches: [bench/supabase-verification]
    paths: ['.github/workflows/edge-benchmark-logs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    if: github.repository == 'azaho/sci' && github.ref == 'refs/heads/bench/supabase-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Read recorded benchmark runtime logs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SCI_EDGE_BENCH_SUPABASE_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: python benchmarks/edge/collect_logs.py benchmarks/edge/results/2026-11-06/deployment.json "$RUNNER_TEMP/edge-logs"
      - uses: actions/upload-artifact@v4
        with:
          name: edge-benchmark-logs
          path: ${{ runner.temp }}/edge-logs/
