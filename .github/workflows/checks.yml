name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  components:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.detect.outputs.python }}
      typescript: ${{ steps.detect.outputs.typescript }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: detect
        shell: bash
        run: |
          python=false
          typescript=false
          if [[ -e pyproject.toml || -d python || -d cli ]]; then python=true; fi
          if [[ -d typescript ]]; then typescript=true; fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "typescript=$typescript" >> "$GITHUB_OUTPUT"

  python-tests:
    needs: components
    if: needs.components.outputs.python == 'true'
    name: Python library and CLI (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-packages --locked
      - run: uv run ruff check python cli
      - run: uv run ruff format --check python cli
      - run: uv run mypy --strict python/pysci cli/sci
      - name: Unit tests and protocol conformance
        run: uv run pytest python/tests cli/tests

  typescript:
    name: typescript
    needs: components
    if: needs.components.outputs.typescript == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.x
      - run: npm ci
      - name: Type check, lint, build, Node and Deno tests, protocol conformance
        run: npm run check

  install:
    needs: components
    if: needs.components.outputs.python == 'true'
    name: Documented Git installation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Install from this commit in clean environments
        run: cli/tests/install_check.sh "${{ github.server_url }}/${{ github.repository }}" "${{ github.event.pull_request.head.sha || github.sha }}"

  # Keep this name stable: main requires the python check.
  python:
    name: python
    needs: [components, python-tests, install]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      COMPONENTS_RESULT: ${{ needs.components.result }}
      PYTHON_PRESENT: ${{ needs.components.outputs.python }}
      TESTS_RESULT: ${{ needs.python-tests.result }}
      INSTALL_RESULT: ${{ needs.install.result }}
    steps:
      - name: Check Python results
        shell: bash
        run: |
          [[ "$COMPONENTS_RESULT" == success ]] || exit 1
          if [[ "$PYTHON_PRESENT" == true ]]; then
            [[ "$TESTS_RESULT" == success && "$INSTALL_RESULT" == success ]] || exit 1
          else
            [[ "$PYTHON_PRESENT" == false && "$TESTS_RESULT" == skipped && "$INSTALL_RESULT" == skipped ]] || exit 1
            echo "Python library and CLI are absent; no Python implementation tests apply."
          fi
