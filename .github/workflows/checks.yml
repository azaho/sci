name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.1
      - run: uv sync --all-packages --locked
      - run: uv run ruff check python cli
      - run: uv run ruff format --check python cli
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build --package pysci && uv build --package sci-cli
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix typescript --ignore-scripts
      - run: npm run build --prefix typescript
      - run: npm test --prefix typescript
      - run: npm audit --prefix typescript --omit=dev
