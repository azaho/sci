[tool.uv.workspace]
members = ["python", "cli"]
[dependency-groups]
dev = ["pytest==8.4.2", "mypy==1.18.2", "ruff==0.14.3", "build==1.3.0"]
[tool.mypy]
strict = true
files = ["python/pysci", "cli/sci"]
[tool.ruff]
line-length = 100
exclude = ["protocol/test-vectors"]
[tool.pytest.ini_options]
testpaths = ["python/tests", "cli/tests"]
