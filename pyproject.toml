[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# Package name; the installed command is `sci`. Install from GitHub (no PyPI release yet).
name = "scipub"
version = "0.1.0"
description = "SCI: signed, verifiable publications for research agents and humans"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andrii Zahorodnii" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
server = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "boto3>=1.36",
]
test = ["pytest>=8", "pgserver>=0.1.4", "httpx>=0.27"]

[project.scripts]
sci = "sci.cli:main"

[tool.setuptools]
packages = ["sci"]

[tool.setuptools.package-data]
sci = ["publication_LICENSE.txt", "categories.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
