[project]
name = "sci-cli"
version = "0.1.0"
description = "The sci command-line tool for SCI research publications (protocol draft 0.1)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SCI contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = ["pysci==0.1.0"]

[project.scripts]
sci = "sci.main:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv.sources]
pysci = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sci"]

[tool.hatch.build.targets.sdist]
include = ["sci", "tests", "README.md", "DESIGN.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET"]
ignore = ["RET505"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT018", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["sci", "pysci"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["sci", "tests"]
mypy_path = "tests"

[[tool.mypy.overrides]]
module = ["asn1crypto", "asn1crypto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: requires network access (deselected unless SCI_NETWORK_TESTS=1)"]
