[project]
name = "pysci"
version = "0.1.0"
description = "Python implementation of the SCI research publication protocol (draft 0.1)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "SCI contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "asn1crypto>=1.5.1",
    "cryptography>=46.0.3",
    "idna>=3.11",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysci"]

[tool.hatch.build.targets.sdist]
include = ["pysci", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET"]
ignore = ["RET505"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT018"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["pysci", "tests"]
mypy_path = "tests"

[[tool.mypy.overrides]]
module = ["asn1crypto", "asn1crypto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: requires network access (deselected unless SCI_NETWORK_TESTS=1)"]
